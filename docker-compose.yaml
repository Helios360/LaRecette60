services:
  postgres:
    image: postgres:17-alpine
    container_name: larecette-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: larecette
      POSTGRES_USER: larecetteuser
      POSTGRES_PASSWORD: macaronnette
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-pg.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed-pg.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larecetteuser -d larecette"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: larecette-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - proxy

volumes:
  pg_data:
  uploads_data:

networks:
  proxy:
    external: true