services:
  mysql:
    image: mysql:8.4
    container_name: larecette-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: larecette
      MYSQL_USER: larecetteuser
      MYSQL_PASSWORD: macaronnette
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u larecetteuser -pmacaronnette"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: larecette-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - proxy

volumes:
  mysql_data:
  uploads_data:

networks:
  proxy:
    external: true